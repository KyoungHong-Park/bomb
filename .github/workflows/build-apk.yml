name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 웹 정적 리소스 디렉토리(www) 준비
        run: |
          mkdir -p www
          cp index.html www/

      - name: 종속성 설치 및 안드로이드 프로젝트 생성
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: APK 빌드 (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}"

      - name: APK 파일 이름 변경 (bomb-game.apk)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./bomb-game.apk

      - name: GitHub Releases에 최신 APK 자동 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "복불복 폭탄게임 최신 버전"
          files: ./bomb-game.apk
          prerelease: false
